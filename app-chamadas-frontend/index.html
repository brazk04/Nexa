<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/pwa-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101116" />
    <meta name="application-name" content="Nexa" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nexa" />
    <meta name="description" content="Converse com sua equipe, faça chamadas e compartilhe sua tela no Nexa." />
    <meta property="og:title" content="Nexa — o lugar da sua equipe" />
    <meta property="og:description" content="Salas, mensagens, chamadas e próximos passos em um só espaço para sua equipe." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:image" content="https://nexa-chi-dusky.vercel.app/pwa-512.png" />
    <title>Nexa</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('cw-theme');
          const dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.querySelector('meta[name="theme-color"]').content = dark ? '#101116' : '#f4f5f9';
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
